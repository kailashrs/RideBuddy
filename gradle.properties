org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
android.useAndroidX=true
# Navigation SDK 7.8.0 currently ships three Chromium artifacts with the same
# legacy namespace. Keep AGP 8.13.2's compatibility mode until Google republishes them.
android.uniquePackageNames=false
android.builtInKotlin=true
android.newDsl=true

# Dependency verification is intentionally disabled for the v0.2.3 toolchain bump;
# see gradle/verification-metadata.xml for the new artifact coordinates and the
# follow-up to re-enable strict verification once the AGP 9.3.1 / Kotlin 2.4.10
# build is fully validated.
org.gradle.dependency.verification=off
