name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify debug build
        run: ./gradlew testDebugUnitTest assembleDebug assembleBenchmark --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Upload lint results
        if: hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          wait-for-processing: false

      - name: Compile instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Match release tag to app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t configured_versions < <(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          if [[ "${#configured_versions[@]}" -ne 1 ]]; then
            echo "Could not determine one app versionName" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${configured_versions[0]}" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match app versionName ${configured_versions[0]}" >&2
            exit 1
          fi

      - name: Validate release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for secret_name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_CERT_SHA256; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required release secret: $secret_name" >&2
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          release_keystore_path="$RUNNER_TEMP/ridebuddy-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$release_keystore_path"
          chmod 600 "$release_keystore_path"
          echo "RELEASE_STORE_FILE=$release_keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Sanitize release ref name
        shell: bash
        run: |
          set -euo pipefail
          safe_ref_name="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')"
          if [[ -z "$safe_ref_name" ]]; then
            echo "The release ref name has no safe filename characters" >&2
            exit 1
          fi
          echo "RELEASE_REF_NAME=$safe_ref_name" >> "$GITHUB_ENV"

      - name: Verify release signer and prepare artifact
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          latest_build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          apksigner_path="$ANDROID_HOME/build-tools/$latest_build_tools/apksigner"
          release_apks=(app/build/outputs/apk/release/*.apk)
          if [[ ! -e "${release_apks[0]}" ]]; then
            echo "No release APK was produced" >&2
            exit 1
          fi

          for release_apk in "${release_apks[@]}"; do
            signer_output="$("$apksigner_path" verify --print-certs "$release_apk")"
            echo "apksigner output:"
            echo "$signer_output"
            if grep -Fq "CN=Android Debug" <<< "$signer_output"; then
              echo "Release APK is signed with an Android Debug certificate: $release_apk" >&2
              exit 1
            fi
            expected_fingerprint="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            actual_fingerprint="$(grep -i 'SHA-256\|SHA256' <<< "$signer_output" | head -1 | awk -F': ' '{print $NF}' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            echo "Expected signer SHA-256: $expected_fingerprint"
            echo "Actual   signer SHA-256: $actual_fingerprint"
            if [[ ! "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]]; then
              echo "RELEASE_CERT_SHA256 is not a 64-character hex fingerprint" >&2
              exit 1
            fi
            if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
              echo "Release APK certificate does not match RELEASE_CERT_SHA256: $release_apk" >&2
              exit 1
            fi
          done

          mkdir -p release-artifacts
          cp "${release_apks[0]}" "release-artifacts/RideBuddy-$RELEASE_REF_NAME-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RideBuddy-release-${{ github.run_id }}
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-artifacts/RideBuddy-$RELEASE_REF_NAME-release.apk" \
            --title "RideBuddy $GITHUB_REF_NAME" \
            --generate-notes
